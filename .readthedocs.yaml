# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# casagui is no longer developed; cubevis replaces it.  Read the Docs no
# longer builds the Sphinx documentation: docs/rtd_parked.py writes a page
# saying so, with links to the cubevis documentation, for every page the old
# documentation had (and for any other address, as 404.html).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python docs/rtd_parked.py "$READTHEDOCS_OUTPUT/html"
